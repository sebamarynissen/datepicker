<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Bad UX World Cup</title>
	<script type="module" src="/main.js"></script>
	<style>
		body {
			font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
			background: black;
			color: white;
			padding: 20px;
		}
		input {
			border: none;
			background: none;
			outline: none;
			color: white;
			font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
			border-bottom: white 1px solid;
			width: 64px;
		}

			font-size: 16px;
		}

</head>
<body>
	<div id="terminal">
		<form>
			Enter the first 7 digits of the hex value of the sha256 hash of your birth date formatted as YYYY-MM-DD:
